name: prova

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  casi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: I casi che il rilevatore deve prendere, e quelli che deve lasciare stare
        run: python3 test/prova_sbobba.py
